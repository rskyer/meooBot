<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MeooBot | 404</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", sans-serif;
      background: #f0f9fc;
      min-height: 100vh;
      padding: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 760px;

      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px);

      border-radius: 32px;
      padding: 3.5rem;

      text-align: center;

      border: 1px solid rgba(135, 206, 250, 0.2);

      box-shadow:
        0 4px 6px -1px rgba(0, 0, 0, 0.02),
        0 20px 60px -12px rgba(0, 150, 180, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .error-code {
      font-size: 6rem;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.07em;

      background: linear-gradient(
        135deg,
        #006680 0%,
        #00acc1 100%
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .title {
      margin-top: 1rem;

      font-size: 1.6rem;
      font-weight: 700;

      color: #005a66;
    }

    .message {
      margin-top: 0.8rem;

      color: #5b7f88;
      font-size: 0.95rem;
      line-height: 1.7;
    }

    .checks {
      margin: 2rem auto;

      max-width: 460px;

      display: grid;
      gap: 0.75rem;
    }

    .check {
      padding: 0.9rem 1.1rem;

      background: #f8fcfe;

      border: 1px solid rgba(0, 180, 200, 0.07);
      border-radius: 12px;

      color: #294953;

      font-size: 0.88rem;
      font-weight: 500;

      text-align: left;

      transition: 0.2s ease;
    }

    .check:hover {
      border-color: rgba(0, 180, 200, 0.16);
      box-shadow: 0 4px 16px rgba(0, 150, 180, 0.05);
    }

    .check::before {
      content: "•";

      color: #00acc1;
      font-weight: 800;

      margin-right: 0.65rem;
    }

    .actions {
      margin-top: 2rem;
    }

    .docs-button {
      display: inline-flex;

      align-items: center;
      justify-content: center;
      gap: 0.7rem;

      min-height: 48px;

      padding: 0.85rem 1.5rem;

      background: linear-gradient(
        135deg,
        #006f7a,
        #00a7b8
      );

      color: white;

      text-decoration: none;

      border-radius: 12px;

      font-size: 0.9rem;
      font-weight: 600;

      box-shadow:
        0 6px 18px rgba(0, 150, 180, 0.18);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .docs-button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 9px 24px rgba(0, 150, 180, 0.25);
    }

    .arrow {
      transition: transform 0.2s ease;
    }

    .docs-button:hover .arrow {
      transform: translateX(-3px);
    }

    .footer {
      margin-top: 2.5rem;
      padding-top: 1.25rem;

      border-top: 1px solid rgba(0, 180, 200, 0.08);

      color: #71939b;
      font-size: 0.75rem;
    }

    @media (max-width: 600px) {
      body {
        padding: 1rem 0.7rem;
      }

      .container {
        padding: 2.5rem 1.25rem;
        border-radius: 24px;
      }

      .error-code {
        font-size: 4.8rem;
      }

      .title {
        font-size: 1.3rem;
      }

      .message {
        font-size: 0.85rem;
      }

      .check {
        font-size: 0.8rem;
        padding: 0.85rem 1rem;
      }

      .docs-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="error-code">
      404
    </div>

    <h1 class="title">
      CANNOT FIND THE DOCTYPE
    </h1>

    <p class="message">
      The requested page could not be found.
    </p>

    <div class="checks">

      <div class="check">
        Check your internet
      </div>

      <div class="check">
        Check your URL
      </div>

      <div class="check">
        Ask from Skyer
      </div>

    </div>

    <div class="actions">

      <a
        class="docs-button"
        href="https://rskyer.github.io/meooBot/docs/"
      >
        <span>Meoo Bot DOCUMENTATION</span>
        <span class="arrow">→</span>
      </a>

    </div>

    <div class="footer">
      MeooBot · Documentation
    </div>

  </main>

</body>
</html>
